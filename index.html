<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>La Previa · XV de Selena</title>

  <!-- Open Graph -->
  <meta property="og:title" content="La Previa · XV de Selena" />
  <meta property="og:description" content="Antes de que arrancara la magia... los protagonistas hablaron 🎤" />
  <meta property="og:image" content="preview.png" />
  <meta property="og:type" content="website" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:image" content="preview.png" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,400&family=Nunito:wght@400;600;800&display=swap" rel="stylesheet" />

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      font-family: 'Nunito', sans-serif;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
      overflow-x: hidden;
      position: relative;
      background: #8B6914;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: linear-gradient(160deg, #6b4f10 0%, #a07820 40%, #7a5a12 100%);
      z-index: 0;
    }

    body::after {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 180px 180px at 10% 20%, rgba(255,220,100,0.18) 0%, transparent 70%),
        radial-gradient(ellipse 120px 120px at 85% 15%, rgba(255,220,100,0.14) 0%, transparent 70%),
        radial-gradient(ellipse 200px 200px at 70% 80%, rgba(255,200,80,0.12) 0%, transparent 70%),
        radial-gradient(ellipse 90px 90px at 20% 75%, rgba(255,220,100,0.16) 0%, transparent 70%);
      z-index: 0;
      pointer-events: none;
    }

    .card {
      position: relative;
      z-index: 1;
      background: rgba(0,0,0,0.25);
      backdrop-filter: blur(10px);
      border: 2px solid rgba(212,175,55,0.6);
      border-radius: 24px;
      max-width: 460px;
      width: 100%;
      padding: 2.4rem 2rem;
      text-align: center;
      box-shadow: 0 8px 48px rgba(0,0,0,0.40), inset 0 0 60px rgba(212,175,55,0.05);
    }

    .badge {
      display: inline-block;
      background: rgba(212,175,55,0.25);
      border: 1.5px solid rgba(212,175,55,0.7);
      color: #F5D870;
      font-weight: 800;
      font-size: 0.72rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      padding: 0.3rem 0.9rem;
      border-radius: 999px;
      margin-bottom: 1.1rem;
    }

    h1 {
      font-family: 'Playfair Display', serif;
      font-size: clamp(2.6rem, 10vw, 3.6rem);
      font-weight: 700;
      letter-spacing: 0.02em;
      line-height: 1.1;
      margin-bottom: 0.2rem;
      color: #F5D870;
      text-shadow: 0 2px 12px rgba(0,0,0,0.4);
    }

    .subtitle {
      font-size: 0.9rem;
      font-weight: 600;
      opacity: 0.7;
      margin-bottom: 1.6rem;
      color: #f0d090;
    }

    .divider {
      border: none;
      border-top: 1px solid rgba(212,175,55,0.35);
      margin: 1.3rem 0;
    }

    .video-wrap {
      position: relative;
      width: 100%;
      max-width: 260px;
      margin: 0 auto 1.4rem;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 4px 24px rgba(0,0,0,0.5), 0 0 0 2px rgba(212,175,55,0.4);
      aspect-ratio: 9/16;
    }

    .video-wrap iframe {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: none;
    }

    .mensaje {
      font-size: 0.95rem;
      font-weight: 600;
      line-height: 1.75;
      color: rgba(255,240,200,0.92);
      padding: 0 0.3rem;
    }

    .firma {
      margin-top: 1.3rem;
      font-family: 'Playfair Display', serif;
      font-style: italic;
      font-size: 1.1rem;
      color: #F5D870;
      opacity: 0.85;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="badge">🎤 XV de Selena · 3 de julio 2026</div>
    <h1>La Previa</h1>
    <p class="subtitle">Antes de que arrancara la magia...</p>

    <hr class="divider" />

    <div class="video-wrap">
      <iframe
        src="https://www.youtube.com/embed/6mhe1RMZFJ8?autoplay=0&rel=0"
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
        allowfullscreen>
      </iframe>
    </div>

    <hr class="divider" />

    <p class="mensaje">
      ¿Nerviosa? ¿Emocionada? ¿Lista?<br/><br/>
      Los protagonistas de la noche hablaron antes de que todo empezara.<br/><br/>
      Mirá lo que dijeron antes de que la magia arrancara. ✨
    </p>

    <p class="firma">XV de Selena · 3 de julio 2026 🤍</p>
  </div>

</body>
</html>
